<!DOCTYPE html>
<html>
<head>

    <title>TrackForge Admin</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style_admin.css') }}">

</head>

<body>

<div class="sidebar p-3">

    <h4 class="text-white mb-4">
        <i class="bi bi-box"></i> TrackForge
    </h4>

    <a href="{{ url_for('admin_dashboard') }}">
        <i class="bi bi-grid me-2"></i> Dashboard
    </a>

    <a href="{{ url_for('admin_parcels') }}">
        <i class="bi bi-box-seam me-2"></i> Parcels
    </a>

  <a href="{{ url_for('admin_tracking') }}">
    <i class="bi bi-geo-alt me-2"></i> Tracking
</a>
    <a href="{{ url_for('admin_customers') }}">
        <i class="bi bi-people me-2"></i> Customers
    </a>

    <a href="{{ url_for('admin_agents') }}">
    <i class="bi bi-person-badge me-2"></i> Agents
</a>

<a href="{{ url_for('admin_branches') }}">
    <i class="bi bi-building me-2"></i> Branches
</a>
<a href="{{ url_for('admin_payments') }}">
    <i class="bi bi-credit-card me-2"></i> Payments
</a>

    <a class="mt-5" href="{{ url_for('admin_logout') }}">
        <i class="bi bi-box-arrow-right me-2"></i> Logout
    </a>

</div>

<main class="main">

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
